<!doctype html>
<!--
  Where a blocked tab lands. Written out by the app with the running task's
  name filled in: a page that says "blocked" and nothing else is an obstacle,
  and one that says what you are meant to be doing instead is a reminder.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked — focus mode</title>
    <style>
      :root {
        --page: #fbfbfa;
        --card: #ffffff;
        --line: #e7e7e3;
        --ink: #14140f;
        --ink-2: #6c6c64;
        --ink-3: #9d9d95;
        --accent: #7b61ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d1117;
          --card: #151b23;
          --line: #3d444d;
          --ink: #f0f6fc;
          --ink-2: #9198a1;
          --ink-3: #656c76;
          --accent: #4493f8;
        }
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        font-weight: 500;
        letter-spacing: -0.005em;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 10px 0 0;
        font-size: 26px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p { margin: 12px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
      .task {
        margin-top: 22px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: left;
      }
      .task span {
        display: block;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .task strong { display: block; margin-top: 4px; font-size: 15px; font-weight: 650; }
      .clock {
        margin-top: 18px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .clock em { display: block; font-size: 11px; font-style: normal; font-weight: 600; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
      footer { margin-top: 24px; font-size: 11px; color: var(--ink-3); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Focus mode</p>
      <h1>Blocked while you focus</h1>
      <p>This site is on your blocklist, and a focus session is running. It opens again as soon as the session ends.</p>

      <div class="task">
        <span>You are on</span>
        <strong>{{task}}</strong>
      </div>

      <div class="clock">
        {{remaining}}
        <em>left in this session</em>
      </div>

      <footer>Crushit · end the session from the menu bar to unblock</footer>
    </main>
  </body>
</html>
